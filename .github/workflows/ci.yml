name: Dragon3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/celulas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dev/celulas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          node --check agent-embassy.js
          node --check catalogo.js
          node --check orquestador.js
          node --check celulas/cargar-imagen.js
          node --check celulas/detectar-herramienta-ia.js

      - name: Validate JSON contracts
        run: |
          node -e 'const fs=require("fs"); const files=["package.json","configuracion.json","celulas/index.json","celulas/analizadorHerramientasSospechosas.json"]; for (const file of files) JSON.parse(fs.readFileSync(file,"utf8")); console.log("JSON válido")'

      - name: Detect embedded secrets
        run: |
          if grep -Eq "mongodb\\+srv://|REDIS_PASSWORD:[[:space:]]*['\"]|JWT_SECRET:[[:space:]]*['\"]" \
            ../../prod/Dragon3/backend/ecosystem.config.cjs agent-embassy.js; then
            echo "Embedded secret detected"
            exit 1
          fi

      - name: Run stable test suite
        run: npm test