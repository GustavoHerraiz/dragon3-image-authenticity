name: Build Dragon3 Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: dragon3-windows-x64
            extension: .exe
            outputName: dragon3-desktop-win-x64.exe
          - name: Linux x64
            os: ubuntu-latest
            command: npm run dist:linux
            artifact: dragon3-linux-x64
            extension: .AppImage
            outputName: dragon3-desktop-linux-x64.AppImage
          - name: macOS Intel
            os: macos-14
            command: npx electron-builder --mac dmg --x64
            artifact: dragon3-macos-x64
            extension: .dmg
            outputName: dragon3-desktop-mac-x64.dmg
          - name: macOS Apple Silicon
            os: macos-14
            command: npx electron-builder --mac dmg --arm64
            artifact: dragon3-macos-arm64
            extension: .dmg
            outputName: dragon3-desktop-mac-arm64.dmg

    defaults:
      run:
        working-directory: prod/Dragon3/backend/scripts/Generador/dragon3-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prod/Dragon3/backend/scripts/Generador/dragon3-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Normalize installer filename
        env:
          ARTIFACT_EXTENSION: ${{ matrix.extension }}
          ARTIFACT_NAME: ${{ matrix.outputName }}
        run: node -e "const fs=require('fs'); const dir='dist'; const ext=process.env.ARTIFACT_EXTENSION; const output=process.env.ARTIFACT_NAME; const source=fs.readdirSync(dir).find(name => name.endsWith(ext) && name !== output); if (!source) throw new Error('No se encontró el instalador '+ext); fs.copyFileSync(dir+'/'+source, dir+'/'+output); console.log(source+' -> '+output);"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: prod/Dragon3/backend/scripts/Generador/dragon3-desktop/dist/${{ matrix.outputName }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dragon3-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --generate-notes --title "Dragon3 Desktop ${{ github.ref_name }}"