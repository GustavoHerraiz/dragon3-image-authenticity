<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon3 Sandbox | Terminal de Blindaje</title>
    <style>
        :root {
            --glow: #00ff00;
            --bg: #0a0a0a;
            --accent: #0080ff;
            --danger: #ff4444;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 480px;
            text-align: center;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 15px;
            background: #111;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Zona de Carga Mejorada */
        #drop-zone {
            border: 2px dashed #444;
            padding: 50px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.02);
        }

        #drop-zone.dragover {
            border-color: var(--glow);
            background: rgba(0, 255, 0, 0.05);
            box-shadow: inset 0 0 20px var(--glow);
        }

        #drop-zone:hover { border-color: var(--glow); }

        /* Botones */
        .btn-group { display: flex; gap: 15px; justify-content: center; }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .btn-sellar { background: #222; color: var(--glow); border: 1px solid var(--glow); }
        .btn-sellar:hover { background: var(--glow); color: black; box-shadow: 0 0 20px var(--glow); }

        .btn-analizar { background: #222; color: var(--accent); border: 1px solid var(--accent); }
        .btn-analizar:hover { background: var(--accent); color: white; box-shadow: 0 0 20px var(--accent); }

        /* Consola de Resultados */
        #result-container {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.5s;
        }

        #status-text { font-size: 10px; color: #888; margin-bottom: 5px; text-transform: uppercase; }

        #result {
            text-align: left;
            background: #000;
            padding: 15px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #222;
            font-size: 11px;
            color: #00ff00; /* Verde matrix */
        }

        pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .loader {
            height: 2px;
            width: 0%;
            background: var(--glow);
            margin-top: 10px;
            transition: width 0.5s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="letter-spacing: 8px; color: var(--glow); margin-bottom: 5px;">DRAGON3</h2>
        <p style="color: #666; font-size: 10px; margin-bottom: 30px;">SANDBOX TERMINAL | MENTALIST CORE V20</p>

        <input type="file" id="file-input" style="display:none" accept="image/*">

        <div id="drop-zone">
            <span id="drop-text">ARRASTRE IMGEN O HAGA CLIC</span>
        </div>

        <div class="btn-group">
            <button class="btn-sellar" onclick="processFile('marcar')">Sellar MBH</button>
            <button class="btn-analizar" onclick="processFile('verificar')">Verificar</button>
        </div>

        <div id="result-container">
            <div id="status-text">Estado del Sistema: <span id="status-val">Esperando...</span></div>
            <div id="loader-bar" class="loader"></div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const resDiv = document.getElementById('result');
        const resContainer = document.getElementById('result-container');
        const statusVal = document.getElementById('status-val');
        const loaderBar = document.getElementById('loader-bar');

        let selectedFile = null;

        // Gestión de selección de archivos
        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = e => handleFile(e.target.files[0]);

        dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        };

        function handleFile(file) {
            if (!file) return;
            selectedFile = file;
            document.getElementById('drop-text').innerHTML = `
                <strong style="color:var(--glow)">ARCHIVO CARGADO</strong><br>
                ${file.name} (${(file.size/1024).toFixed(1)} KB)
            `;
            resContainer.style.display = 'none';
        }

        async function processFile(accion) {
            if(!selectedFile) return alert("Error: No hay archivo en la cámara de carga.");

            // UI Reset
            resContainer.style.display = 'block';
            statusVal.innerText = "PROCESANDO EN CORE...";
            statusVal.style.color = "var(--glow)";
            loaderBar.style.width = "40%";
            resDiv.innerText = ">> Iniciando protocolos de blindaje...";

            const fd = new FormData();
            fd.append('archivo', selectedFile);
            fd.append('accion', accion);

            try {
                const response = await fetch('/api/process', { method: 'POST', body: fd });

                // Ahora el servidor SIEMPRE responde con un JSON (tanto para sellar como para verificar)
                const data = await response.json();

                loaderBar.style.width = "100%";

                if (accion === 'marcar') {
                    // Acción MARCAR: Confirmación de guardado local (Persistencia Cero en la red)
                    statusVal.innerText = "SELLADO COMPLETADO";
                    resDiv.innerHTML = `
                        <p style="color:var(--glow); font-weight:bold; font-size:14px; margin-bottom: 5px;">🐉 SELLO INCRUSTADO CON ÉXITO</p>
                        <p style="margin-top: 0;">El archivo ha sido blindado y guardado de forma segura en la carpeta <strong>/Sellados</strong> de este servidor.</p>
                        <hr style="border:0; border-top:1px dashed #333; margin: 10px 0;">
                        <p style="font-size:11px; color:#888; margin: 2px 0;">ID Operativo: <span style="color:#fff;">${data.id_mbh || 'CONFIRMADO'}</span></p>
                        <p style="font-size:11px; color:#888; margin: 2px 0;">Archivo Final: <span style="color:#fff;">${data.path || selectedFile.name}</span></p>
                    `;
                } else {
                    // Acción VERIFICAR: Mostramos el reporte forense completo
                    statusVal.innerText = "ANÁLISIS COMPLETADO";
                    resDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (e) {
                statusVal.innerText = "ERROR DE CONEXIÓN";
                statusVal.style.color = "var(--danger)";
                resDiv.innerText = ">> Fallo crítico: La Sandbox no responde o ha rechazado la operación.";
            }
        }
    </script>
</body>
</html>
