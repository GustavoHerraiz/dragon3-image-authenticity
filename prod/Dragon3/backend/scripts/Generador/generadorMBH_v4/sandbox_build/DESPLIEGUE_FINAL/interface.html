<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon3 Sandbox</title>
    <style>
        :root { --glow: #00ff00; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { width: 450px; text-align: center; border: 1px solid #333; padding: 30px; border-radius: 15px; background: #111; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #drop-zone { border: 2px dashed var(--glow); padding: 40px 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        #drop-zone:hover { background: rgba(0, 255, 0, 0.05); box-shadow: inset 0 0 10px var(--glow); }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        .btn-sellar { background: var(--glow); color: black; }
        .btn-sellar:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--glow); }
        .btn-analizar { background: #0080ff; color: white; }
        #result { margin-top: 20px; font-size: 12px; text-align: left; background: #000; padding: 10px; border-radius: 5px; max-height: 150px; overflow-y: auto; display: none; border: 1px solid #222; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="letter-spacing: 5px; color: var(--glow);">DRAGON3</h2>
        <p style="color: #666; font-size: 11px;">V20 MENTALIST CORE - GUSTAVO HERRAIZ EDITION</p>

        <div id="drop-zone">Arraste aquí su imagen (JPG/PNG)</div>

        <div class="btn-group">
            <button class="btn-sellar" onclick="process('sellar')">Sellar</button>
            <button class="btn-analizar" onclick="process('analizar')">Analizar</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        let file = null;

        dropZone.ondragover = e => { e.preventDefault(); };
        dropZone.ondrop = e => {
            e.preventDefault();
            file = e.dataTransfer.files[0];
            dropZone.innerHTML = `<strong>ARCHIVO LISTO:</strong><br>${file.name}`;
            dropZone.style.borderColor = '#fff';
        };

        async function process(accion) {
            if(!file) return alert("Suba un archivo primero");
            const resDiv = document.getElementById('result');
            resDiv.style.display = 'block';
            resDiv.innerText = "Procesando en el Core de Dragon...";

            const fd = new FormData();
            fd.append('archivo', file);
            fd.append('accion', accion);

            try {
                const response = await fetch('/api/process', { method: 'POST', body: fd });
                const data = await response.json();
                resDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (e) {
                resDiv.innerText = "Error de conexión con la Sandbox.";
            }
        }
    </script>
</body>
</html>
